# Linux-only webcam support.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.linux.yml up -d
#
# Keep the portable base file unchanged for Windows/Docker Desktop.
services:
  mosquitto:
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
  mediamtx:
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro,Z
      - ../samples:/samples:ro,z
  frigate:
    volumes:
      - frigate-config:/config
      - ../frigate/config.yml:/config/config.yml:Z
      - frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
  ibvap-core:
    volumes:
      - ibvap-data:/app/data
      - ../ibvap-core/config:/app/config:ro,z
      - ../dashboard/dist:/app/dashboard:ro,z

volumes:
  frigate-config:
  frigate-media:
  ibvap-data:
